rm.png){size=large}\n\n- 这些条目是资料库的骨架，也是后续录入版本条目的前提。\n- 常见字段包括中文名、外文名、国家、摘要、导览文字、图片和关联专栏。\n- `slug`、排序键和作品类型路径这类内部字段会自动生成或自动维护，不需要手动输入。\n- 人物可以拥有复合身份，例如同一条目同时勾选“作曲家”和“指挥”。\n- 团体与人物是独立条目，不应互相覆盖；如果切换顶层标签，系统会自动清空不兼容表单，避免串值。\n\n## 5. 创建版本条目\n\n![版本条目上半部分](/library-assets/managed/articles/usage-guide/owner-recording-form-top.png){size=large}\n\n- 版本条目对应具体录音或录像，需要挂在某个已经存在的作品条目下。\n- 版本条目通常会包含演出时间、地点、专辑名、发行商、图片、资源链接和参与者 `credits`（署名信息）。\n- 建议先准备好作曲家、作品，以及相关的人物或团体条目，再创建版本。\n\n![版本条目的导览与链接区域](/library-assets/managed/articles/usage-guide/owner-recording-links-guide.png){size=large}\n\n- **导览文本**适合填写推荐理由、辨识提示和收听建议。\n- **关联专栏**适合补充长文说明。\n- **资源链接**既支持外部链接，也支持桌面版专用的本地资源链接。\n- 本地资源链接会出现在站点前台资源区，但通常只在当前设备有效；资料库导出到其他设备后，这类链接一般需要重新整理。\n\n## 6. 自动检查与候选审查\n\n![自动检查界面](/library-assets/managed/articles/usage-guide/owner-auto-check.png){size=large}\n\n- 自动检查会根据当前条目类型给出候选补全结果，但不会直接覆盖正式数据。\n- 对人物、团体、作品等基础条目，自动检查更适合补齐摘要、国家、图片和命名规范。\n- 对版本条目，自动检查通常会联动版本检索工具，帮助整理候选链接和元信息。\n\n![候选审查界面](/library-assets/managed/articles/usage-guide/owner-review.png){size=large}\n\n- 候选审查用于逐项确认或放弃自动检查结果。\n- 只有在这里确认应用后，候选内容才会写入正式资料库。\n\n## 7. 批量更新\n\n![批量更新界面](/library-assets/managed/articles/usage-guide/owner-batch-update.png){size=large}\n\n- 批量更新适合一次处理多条版本草稿或待补录的版本。\n- 使用前建议先准备好作曲家、作品以及相关的人物和团体条目。\n- 建议先小范围测试你的输入格式，确认匹配逻辑正常后再扩大处理范围。\n\n## 8. 专栏\n\n![专栏编辑界面](/library-assets/managed/articles/usage-guide/owner-articles.png){size=large}\n\n- 专栏用于承载不适合作为单一条目附属说明的长文本，例如使用手册、入门专题、人物合集和榜单。\n- 专栏支持 `Markdown`（标记语言）正文和图片插入，`slug` 会根据标题自动生成并维护。\n- 勾选“在首页展示”后，专栏会出现在站点首页的推荐专栏区域。\n\n## 9. 版本检索工具\n\n![版本检索工具](/library-assets/managed/articles/usage-guide/retrieval-home.png){size=large}\n\n- 版本检索工具是维护工具的辅助组件，主要用于帮助版本条目生成候选结果。\n- 如果维护工具中的版本自动检查结果异常，可以单独打开它查看输入、候选和返回结果，便于排查问题。\n\n## 10. 推荐工作顺序\n\n1. 从默认空库开始，或导入已有资料库。\n2. 先创建作曲家、人物、团体和作品等基础条目。\n3. 再创建版本条目，补充导览文本、图片和资源链接。\n4. 运行自动检查，并在候选审查中确认需要应用的内容。\n5. 需要时使用批量更新处理多条版本。\n6. 编写专栏，并把适合公开展示的专栏勾选到首页。\n7. 点击“构建不全书”，再用“打开本地构建库”检查前台效果。\n8. 定期导出整个资料库，作为备份和迁移副本。\n\n## 11. 范围与限制\n\n- 自动检查和版本检索属于辅助功能，结果仍需要人工确认。\n- 本地资源链接适合桌面版个人使用，不适合直接公开到互联网。\n- 合并、批量更新和候选审查都建议先在小范围内试运行，再扩大到全库。\n- 构建后的站点是静态展示层，不会替代资料库本身；真正可编辑的数据仍保存在资料库目录中。"],"aliasTokens":[]}];
